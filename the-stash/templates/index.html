{% extends "base.html" %}
{% block content %}
<section>
  {% if posts|length == 0 %}
    <p>No posts yet. Check back at 4:20!</p>
  {% else %}
    <ul class="post-list">
      {% for post in posts %}
      <li>
        <a href="/{{ post.url }}">{{ post.title }}</a>
        <span class="post-date">{{ post.created_at[:16].replace('T',' ') }}</span>
      </li>
      {% endfor %}
    </ul>
  {% endif %}
</section>
{% endblock %}
