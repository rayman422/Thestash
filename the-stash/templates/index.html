{% extends "base.html" %}
{% block content %}
<h2>Latest Posts</h2>
<div>
	{% if posts %}
		{% for p in posts %}
			<div class="card">
				<h3 style="margin: 0 0 6px 0"><a href="{{ (base_url or '') + '/posts/' + (p.slug if p.slug else 'post') + '.html' }}">{{ p.title }}</a></h3>
				<p class="meta">{{ p.created_at[:16].replace('T', ' ') }}</p>
				<p>{{ p.excerpt }}</p>
			</div>
		{% endfor %}
	{% else %}
		<p class="meta">No posts yet. Run the publish command to generate one.</p>
	{% endif %}
</div>
{% endblock %}
