<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>{{ title or 'The Stash' }}</title>
	<link rel="stylesheet" href="{{ (base_url or '') + '/css/styles.css' }}">
</head>
<body>
	<header>
		<div class="container">
			<a href="{{ base_url or '/' }}" style="color:inherit; text-decoration:none"><h1 style="margin:0">The Stash</h1></a>
			<p class="meta" style="margin:4px 0 0 0">THC blog that auto-posts AI articles at 4:20</p>
		</div>
	</header>
	<main>
		<div class="container">
			{% block content %}{% endblock %}
		</div>
	</main>
	<footer>
		<div class="container"><span class="meta">&copy; {{ year }} The Stash</span></div>
	</footer>
</body>
</html>
