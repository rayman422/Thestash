<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title if title else site_name }}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Space+Grotesk:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ asset_prefix }}/css/styles.css">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ asset_prefix }}/feed.xml" />
</head>
<body>
  <div class="kaleidoscope-bg"></div>
  <header class="site-header">
    <div class="container">
      <div class="floating-elements">
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
        <div class="floating-shape"></div>
      </div>
      <h1 class="logo"><a href="{{ asset_prefix }}/index.html">The Stash</a></h1>
      <p class="tagline">{{ site_tagline }}</p>
      <nav class="site-nav">
        <a href="{{ asset_prefix }}/index.html">Home</a>
        <a href="{{ asset_prefix }}/about.html">About</a>
        <a href="{{ asset_prefix }}/feed.xml">RSS</a>
      </nav>
    </div>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>© {{ site_name }} — Auto-published at 4:20 AM/PM</p>
    </div>
  </footer>
  <script src="{{ asset_prefix }}/js/cosmic.js"></script>
</body>
</html>
