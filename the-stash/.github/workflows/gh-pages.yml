name: Deploy The Stash to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}
  schedule:
    # 4:20 and 16:20 UTC (adjust if you want PST conversions)
    - cron: '20 4,16 * * *'

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build site
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          BASE_URL: ${{ vars.BASE_URL }}
        run: |
          PYTHONPATH=src python -m stash.main publish

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to Pages
        uses: actions/deploy-pages@v4
