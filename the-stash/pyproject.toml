[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "the-stash"
version = "0.1.0"
description = "THC blog that auto-posts AI articles at 4:20 AM/PM"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "The Stash" }
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
